<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WE CATS フォトコンテスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5f6;--sf:#fff;--sf2:#fdeef0;--bd:#f6d3d8;
  --ac:#e8838f;--ac-d:#c9606d;--tx:#5c3a3e;--tx2:#a07c82;--ng:#d65f5f;--ok:#5c9e7e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.7;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:480px;margin:0 auto;padding:28px 18px 48px}
h1{font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;font-weight:700;font-size:24px;line-height:1.4;text-align:center}
.lead{text-align:center;color:var(--tx2);font-size:13px;margin:6px 0 24px}

/* チェキ風の写真フレーム */
.cheki{display:block;width:78%;max-width:300px;margin:0 auto 28px;background:var(--sf);
  padding:14px 14px 0;border-radius:4px;transform:rotate(-1.5deg);cursor:pointer;
  box-shadow:0 10px 24px rgba(200,90,110,.16),0 2px 4px rgba(200,90,110,.10);transition:transform .2s}
.cheki:active{transform:rotate(-1.5deg) scale(.98)}
.cheki:focus-within{outline:3px solid var(--ac);outline-offset:4px}
.shot{aspect-ratio:1/1;background:var(--sf2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--ac-d);font-size:14px;font-weight:500;overflow:hidden;position:relative}
.shot svg{width:42px;height:42px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.caption{height:62px;display:flex;align-items:center;justify-content:center;
  font-family:'Zen Maru Gothic',sans-serif;font-size:17px;color:var(--tx);padding:0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption.empty{color:var(--tx2);font-size:13px}
#photo{position:absolute;width:1px;height:1px;opacity:0}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px 18px}
.f{margin-bottom:18px}
.f label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;margin-bottom:6px}
.req{font-size:11px;color:var(--ac-d);font-weight:500}
.opt{font-size:11px;color:var(--tx2);font-weight:400}
input[type=text],input[type=email],textarea{width:100%;background:var(--sf2);border:1.5px solid var(--bd);color:var(--tx);
  padding:12px;border-radius:12px;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--ac);background:var(--sf)}
textarea{resize:vertical;min-height:84px}
.hint{font-size:12px;color:var(--tx2);margin-top:4px}
.count{text-align:right}
.terms{background:var(--sf2);border-radius:12px;padding:14px;font-size:12.5px;line-height:1.8;white-space:pre-wrap;
  max-height:190px;overflow-y:auto;border:1px solid var(--bd)}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;cursor:pointer}
.agree input{width:22px;height:22px;accent-color:var(--ac);flex-shrink:0;margin-top:2px}
.err{color:var(--ng);font-size:13px;margin-top:6px;display:none}
.err.on{display:block}
button.send{width:100%;margin-top:22px;padding:16px;border:none;border-radius:28px;background:var(--ac);color:#fff;
  font-family:'Zen Maru Gothic',sans-serif;font-size:17px;font-weight:700;cursor:pointer}
button.send:active{transform:scale(.98)}
button.send[aria-busy=true]{opacity:.7;cursor:wait}
button.send:focus-visible{outline:3px solid var(--ac-d);outline-offset:3px}
.state{text-align:center;padding:30px 8px}
.state h2{font-family:'Zen Maru Gothic',sans-serif;font-size:21px;margin-bottom:8px}
.state p{color:var(--tx2);font-size:14px}
.no{display:inline-block;margin:16px 0 4px;font-family:'Zen Maru Gothic',sans-serif;font-size:40px;font-weight:700;color:var(--ac-d)}
.again{margin-top:22px;background:none;border:1.5px solid var(--bd);color:var(--tx);padding:11px 22px;border-radius:24px;font-size:14px;font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.cheki{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1 id="title">WE CATS フォトコンテスト</h1>
  <p class="lead">お店で撮った猫たちの写真を送ってください</p>

  <p id="loading" class="state">読み込み中…</p>

  <section id="closed" class="state" hidden>
    <h2>応募受付は終了しました</h2>
    <p>たくさんのご応募ありがとうございました。</p>
  </section>

  <section id="done" class="state" hidden>
    <h2>応募が完了しました</h2>
    <p>あなたの応募番号</p>
    <div class="no" id="done-no"></div>
    <p>結果はお店でお知らせします。</p>
    <button class="again" type="button" id="again">もう1枚応募する</button>
  </section>

  <form id="form" novalidate hidden>
    <label class="cheki" for="photo">
      <span class="shot" id="shot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        写真を選ぶ
      </span>
      <span class="caption empty" id="caption">ニックネームがここに入ります</span>
      <input type="file" id="photo" accept="image/*">
    </label>
    <p class="err" id="e-photo" style="text-align:center;margin:-16px 0 18px"></p>

    <div class="card">
      <div class="f">
        <label for="nickname">ニックネーム <span class="req">必須</span></label>
        <input type="text" id="nickname" maxlength="30" autocomplete="nickname" placeholder="ねこまる">
        <p class="err" id="e-nickname"></p>
      </div>
      <div class="f">
        <label for="contact">連絡先 <span class="req">必須</span></label>
        <input type="text" id="contact" maxlength="100" autocomplete="email" placeholder="メールアドレスまたは電話番号">
        <p class="hint">入賞時のご連絡にだけ使います。公開はされません。</p>
        <p class="err" id="e-contact"></p>
      </div>
      <div class="f">
        <label for="comment">ひとことコメント <span class="opt">任意</span></label>
        <textarea id="comment" maxlength="200" placeholder="あくびの瞬間が撮れました"></textarea>
        <p class="hint count"><span id="ccount">0</span> / 200</p>
      </div>
      <div class="f" style="margin-bottom:0">
        <label>応募規約</label>
        <div class="terms" id="terms" tabindex="0"></div>
        <label class="agree"><input type="checkbox" id="consent"> 応募規約に同意して応募する</label>
        <p class="err" id="e-consent"></p>
      </div>
    </div>

    <button class="send" type="submit" id="send">応募する</button>
    <p class="err" id="e-send" style="text-align:center"></p>
  </form>
</main>

<script>
// ===== 設定（POSと同じSupabase） =====
var SUPA_URL = 'https://kidxeqjovvakcqalblre.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZHhlcWpvdnZha2NxYWxibHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjcxMjYsImV4cCI6MjA4OTQwMzEyNn0.YHz0cVTpwQi1zBAZyZuFImDJv2gKQo9HUyC8w86tgsI';
var BUCKET = 'contest-photos';
var MAX_SIDE = 1600;

var $ = function(id){ return document.getElementById(id); };
var termsVersion = null, photoBlob = null, sending = false;

function rpc(fn, args){
  return fetch(SUPA_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{apikey:SUPA_KEY, Authorization:'Bearer ' + SUPA_KEY, 'Content-Type':'application/json'},
    body:JSON.stringify(args || {})
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t); });
    return r.json();
  });
}

function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function(x){ return (x + 256).toString(16).slice(1); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

function showErr(key, msg){ var el = $('e-' + key); el.textContent = msg; el.classList.add('on'); }
function clearErr(key){ var el = $('e-' + key); el.textContent = ''; el.classList.remove('on'); }

// ---------- 写真の縮小 ----------
function loadImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ res(img); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
function shrink(file){
  var getSrc = window.createImageBitmap
    ? createImageBitmap(file, {imageOrientation:'from-image'}).catch(function(){ return loadImage(file); })
    : loadImage(file);
  return getSrc.then(function(src){
    var w = src.width, h = src.height, s = Math.min(1, MAX_SIDE / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.85); });
  });
}

$('photo').addEventListener('change', function(){
  var f = this.files && this.files[0];
  clearErr('photo');
  if(!f) return;
  $('shot').setAttribute('aria-busy', 'true');
  shrink(f).then(function(blob){
    if(!blob) throw new Error('blob');
    photoBlob = blob;
    var old = $('shot').querySelector('img'); if(old) old.remove();
    var img = document.createElement('img');
    img.alt = '選んだ写真';
    img.src = URL.createObjectURL(blob);
    $('shot').appendChild(img);
  }).catch(function(){
    photoBlob = null;
    showErr('photo', 'この写真は読み込めませんでした。別の写真を選んでください。');
  }).then(function(){ $('shot').removeAttribute('aria-busy'); });
});

$('nickname').addEventListener('input', function(){
  var v = this.value.trim();
  $('caption').textContent = v || 'ニックネームがここに入ります';
  $('caption').classList.toggle('empty', !v);
  clearErr('nickname');
});
$('contact').addEventListener('input', function(){ clearErr('contact'); });
$('consent').addEventListener('change', function(){ clearErr('consent'); });
$('comment').addEventListener('input', function(){ $('ccount').textContent = this.value.length; });

// ---------- 送信 ----------
var ERR = {
  closed:'応募受付は終了しました。',
  consent:'応募規約への同意が必要です。',
  nickname:'ニックネームは30文字以内で入力してください。',
  contact:'連絡先を正しく入力してください。',
  comment:'コメントは200文字以内で入力してください。',
  image:'写真の送信に失敗しました。もう一度お試しください。',
  terms_changed:'応募規約が更新されました。ページを再読み込みして、新しい規約を確認してください。',
  busy:'ただいま応募が集中しています。少し時間をおいてお試しください。',
  duplicate:'この写真はすでに送信されています。'
};

$('form').addEventListener('submit', function(e){
  e.preventDefault();
  if(sending) return;
  clearErr('send');
  var nick = $('nickname').value.trim(), contact = $('contact').value.trim(), ok = true;
  if(!photoBlob){ showErr('photo', '写真を選んでください。'); ok = false; }
  if(!nick){ showErr('nickname', 'ニックネームを入力してください。'); ok = false; }
  if(contact.length < 3){ showErr('contact', '連絡先を入力してください。'); ok = false; }
  if(!$('consent').checked){ showErr('consent', '応募規約に同意してください。'); ok = false; }
  if(!ok) return;

  sending = true;
  var btn = $('send');
  btn.setAttribute('aria-busy', 'true'); btn.textContent = '送信中…';
  var path = 'entries/' + uuid() + '.jpg';

  fetch(SUPA_URL + '/storage/v1/object/' + BUCKET + '/' + path, {
    method:'POST',
    headers:{apikey:SUPA_KEY, Authorization:'Bearer ' + SUPA_KEY, 'Content-Type':'image/jpeg', 'x-upsert':'false'},
    body:photoBlob
  }).then(function(r){
    if(!r.ok) throw new Error('upload');
    return rpc('contest_submit', {
      p_nickname:nick, p_contact:contact, p_comment:$('comment').value,
      p_image_path:path, p_terms_version:termsVersion, p_consent:true
    });
  }).then(function(res){
    if(!res || !res.ok){ showErr('send', ERR[res && res.error] || '送信できませんでした。もう一度お試しください。'); return; }
    $('done-no').textContent = 'No.' + res.entry_no;
    $('form').hidden = true; $('done').hidden = false;
    window.scrollTo(0, 0);
  }).catch(function(){
    showErr('send', '送信できませんでした。電波の良い場所でもう一度お試しください。');
  }).then(function(){
    sending = false; btn.removeAttribute('aria-busy'); btn.textContent = '応募する';
  });
});

$('again').addEventListener('click', function(){
  photoBlob = null;
  var img = $('shot').querySelector('img'); if(img) img.remove();
  $('photo').value = ''; $('comment').value = ''; $('ccount').textContent = '0';
  $('consent').checked = false;
  $('done').hidden = true; $('form').hidden = false;
  window.scrollTo(0, 0);
});

// ---------- 初期読み込み ----------
rpc('contest_public_info').then(function(info){
  $('loading').hidden = true;
  if(info && info.title){ $('title').textContent = info.title; document.title = info.title; }
  if(!info || !info.accepting){ $('closed').hidden = false; return; }
  termsVersion = info.terms_version;
  $('terms').textContent = info.terms_body || '';
  $('form').hidden = false;
}).catch(function(){
  $('loading').textContent = '読み込めませんでした。ページを再読み込みしてください。';
});
</script>
</body>
</html>
