<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="今日の数字">
<title>WE CATS 今日の数字</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;background:#fdf3f0;color:#4a3436;min-height:100vh;padding:20px 16px 32px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;text-align:center;color:#c25e74;margin:8px 0 2px}
  .date{text-align:center;font-size:14px;color:#a08; color:#b08a92;margin-bottom:18px}
  .card{background:#fff;border-radius:20px;padding:22px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(194,94,116,.10);text-align:center}
  .k{font-size:15px;color:#b08a92;font-weight:700;letter-spacing:.05em}
  .v{font-size:56px;font-weight:900;color:#c25e74;line-height:1.15}
  .v small{font-size:22px;font-weight:700;color:#b08a92;margin-left:4px}
  .foot{text-align:center;font-size:12px;color:#c4a3a9;margin-top:10px}
  .err{background:#fff;border:1.5px solid #e59aa8;color:#c25e74;border-radius:14px;padding:14px;text-align:center;font-size:14px;display:none;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐱 WE CATS 今日の数字</h1>
  <div class="date" id="d-date">読み込み中…</div>
  <div class="err" id="d-err">数字を読めませんでした。通信を確認して、少し待ってから開き直してください。</div>
  <div class="card"><div class="k">本日の来店</div><div class="v"><span id="d-guests">–</span><small>名</small></div></div>
  <div class="card"><div class="k">滞在中</div><div class="v"><span id="d-staying">–</span><small>組</small></div></div>
  <div class="card"><div class="k">本日の売上</div><div class="v"><small style="margin:0 4px 0 0">¥</small><span id="d-sales">–</span></div></div>
  <div class="foot">1分ごとに自動で更新します（画面を押しても更新）<br><span id="d-updated"></span></div>
</div>
<script>
var SUPA_URL='https://kidxeqjovvakcqalblre.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZHhlcWpvdnZha2NxYWxibHJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4MjcxMjYsImV4cCI6MjA4OTQwMzEyNn0.YHz0cVTpwQi1zBAZyZuFImDJv2gKQo9HUyC8w86tgsI';
function fmt(n){ return (parseInt(n)||0).toLocaleString('ja-JP'); }
function load(){
  fetch(SUPA_URL+'/rest/v1/rpc/wc_public_stats', {
    method:'POST',
    headers:{'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type':'application/json'},
    body:'{}'
  }).then(function(r){
    if(!r.ok) throw new Error('bad');
    return r.json();
  }).then(function(s){
    document.getElementById('d-err').style.display='none';
    var p=String(s.date||'').split('-');
    if(p.length===3) document.getElementById('d-date').textContent=parseInt(p[0])+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';
    document.getElementById('d-guests').textContent=fmt(s.guests);
    document.getElementById('d-staying').textContent=fmt(s.staying);
    document.getElementById('d-sales').textContent=fmt(s.sales);
    var now=new Date();
    document.getElementById('d-updated').textContent='最終更新 '+now.getHours()+':'+('0'+now.getMinutes()).slice(-2);
  }).catch(function(){
    document.getElementById('d-err').style.display='block';
  });
}
document.body.addEventListener('click', load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
